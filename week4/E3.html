<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .todo-box {
      width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="todo-box">
    <h1>To-Do List</h1>

    <div class="input-row">
      <input id="taskInput" type="text" placeholder="Add a task" />
      <button id="addBtn">Add</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <script>
    const input = document.querySelector('#taskInput');
    const addBtn = document.querySelector('#addBtn');
    const todoList = document.querySelector('#todoList');

    function addTask() {
      const taskText = input.value.trim();

      if (!taskText) return;

      const li = document.createElement('li');
      const text = document.createElement('span');
      text.textContent = taskText;

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.textContent = '✕';
      deleteBtn.className = 'delete-btn';

      li.appendChild(text);
      li.appendChild(deleteBtn);
      todoList.appendChild(li);

      input.value = '';
      input.focus();
    }

    addBtn.addEventListener('click', addTask);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    todoList.addEventListener('click', (e) => {
      const deleteBtn = e.target.closest('.delete-btn');

      if (deleteBtn) {
        const item = deleteBtn.closest('li');
        if (item) item.remove();
      }
    });
  </script>
</body>
</html>
