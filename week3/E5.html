<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding-top: 70px;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .links {
      display: flex;
      gap: 20px;
    }

    nav a:hover {
      color: #14b8a6;
    }

    main {
      height: 1500px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="#home">My Site</a>
    <div class="links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <main>
    <h1>Scroll the page</h1>
    <p>The navigation stays fixed at the top.</p>
  </main>
</body>
</html>
