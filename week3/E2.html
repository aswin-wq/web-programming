<!DOCTYPE html>
<html>
<head>
  <style>
    .card {
      position: relative;
      width: 280px;
      height: 180px;
      margin: 40px;
      background: white;
      border: 2px solid #0f766e;
      border-radius: 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(15, 118, 110, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">Hover over me</div>
</body>
</html>
