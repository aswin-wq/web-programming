<!DOCTYPE html>
<style>
  .spinner {
    width: 50px;
    height: 50px;
    background: transparent;
    border: 4px solid #99f6e4;
    border-top-color: #0f766e;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<div class="spinner"></div>
