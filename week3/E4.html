<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #f59e0b;
      --bg: #f0fdfa;
      --text: #134e4a;
      --radius: 12px;
      --space: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #5eead4;
        --accent: #fbbf24;
        --bg: #042f2e;
        --text: #ccfbf1;
      }
    }

    body {
      margin: var(--space);
      padding: var(--space);
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 280px;
      padding: var(--space);
      background: var(--bg);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
    }

    button {
      padding: calc(var(--space) / 2) var(--space);
      background: var(--primary);
      color: var(--text);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
    }

    button:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p>A simple theme using CSS variables.</p>
    <button>Continue</button>
  </div>
</body>
</html>
